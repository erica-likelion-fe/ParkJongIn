<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>숫자 맞추기 게임</title>
</head>
<body>

    <h1>숫자 맞추기 게임</h1>

    <p>1부터 100 사이의 숫자를 맞춰봅시다</p>

    <div> 
        <input type="number" id="guessInput" placeholder="숫자 입력" min="1" max="100">
        <button id="guessButton">확인</button>
    </div>

    <p id="message">
    </p>
    <p id="attempts">
        남은 기회: 10
    </p>

    <script src="practice.js"></script>
</body>
</html>
